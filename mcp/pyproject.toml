[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rosud-mcp"
version = "0.1.0"
description = "Rosud MCP Server - Claude 에이전트가 USDC 결제를 직접 실행하는 MCP 서버"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "usdc", "payments", "ai-agents", "rosud"]
dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "respx>=0.21.0",
]

[project.scripts]
rosud-mcp = "rosud_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rosud_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
